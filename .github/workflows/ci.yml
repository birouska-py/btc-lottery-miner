name: CI

# Execução MANUAL (workflow_dispatch) para economizar a cota gratuita de Actions.
on:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala o uv
        uses: astral-sh/setup-uv@v5

      - name: Instala as dependências
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest (com cobertura)
        run: uv run pytest

      - name: Publica o coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: btc-lottery-miner:ci
